name: PumpFun runner

# This repo exists for one reason: GitHub Actions minutes are billed on
# whichever repo a workflow RUNS in, and public repos get unlimited free
# minutes on GitHub-hosted runners. All the actual code, trading
# strategy, and trade data live in the PRIVATE repo
# (S1aughterHau5/Claude, PumpFun/ directory) -- this workflow just checks
# that code out, runs one cycle of it, and pushes the results straight
# back. This repo holds no trading logic of its own; it's a free compute
# + scheduling shell around the real project.
#
# Console output from the actual trading cycle is deliberately
# suppressed below (redirected to a file, only surfaced if something
# fails) -- the channel owner asked to keep this public repo's own
# Actions log minimal, 2026-09-15.
#
# Self-dispatch chain, same pattern as (and directly copied from) the
# private repo's own pumpfun-mechanical-cycle.yml -- see that file's
# header for the full reasoning on why a plain `schedule` cron alone
# isn't relied on for cadence.
#
# IMPORTANT: only ONE of {this workflow, the private repo's own
# pumpfun-mechanical-cycle.yml} should ever be the active chain at a
# time -- both would write to the same wallet.json in the private repo,
# and running both concurrently would race and corrupt that state. The
# private repo's own workflow is paused (2026-09-15, Actions-minutes
# emergency stop) specifically so this one can be the sole driver.
#
# Requires one repository secret here, PUMPFUN_PRIVATE_REPO_TOKEN: a
# fine-grained GitHub personal access token scoped to ONLY
# S1aughterHau5/Claude, with "Contents: Read and write" permission and
# nothing else -- see that repo's PumpFun/README.md for the exact setup
# steps. This token can never touch any other repository, public or
# private, even though it lives as a secret in this public one. GitHub
# Actions automatically redacts any registered secret value from every
# log line, and this workflow never echoes it directly -- only ever
# references it inside the `with:`/`Authorization:` fields below.
#
# PAUSED 2026-09-22 -- channel owner: "Stop the pump fun trading bot.
# Stop everything." Same procedure this workflow's own history already
# documents below: both the schedule: trigger AND the actual dispatch
# logic in "Self-dispatch next tick" are commented/cut, left in place
# rather than deleted, so resuming is a straight revert of this commit
# plus a manual workflow_dispatch. Cancelling an in-progress run alone
# does not stop a self-rechaining workflow -- that's why both places are
# touched, not just one.
#
# RESUMED 2026-09-17 -- channel owner stopped live trading (real losses,
# see the private repo's own live-cycle history) and asked to restart
# paper trading: "Start paper trading...reset slots...$500 starting
# wallet. 0.03 sol per trade." The RPC-contention reason this was paused
# for (2026-09-16, below) no longer applies with live trading stopped.
# Was PAUSED 2026-09-16 -- channel owner: "Paper trading should be paused
# before running the pilot." Both the real 5-coin pilot
# (pumpfun-live-cycle.yml, in the private repo) and this paper cycle hit
# the SAME free public Solana RPC endpoint, and a live dry run already
# showed real contention between them (a wall of 429 "Too many
# requests" errors during a dry-run scan while this chain kept running
# alongside it) -- pausing this removes that contention entirely while
# the pilot runs, and keeps the two systems' activity impossible to
# conflate while real money is involved. If live trading is ever resumed
# again while this is still active, re-pause this the same way (comment
# out BOTH the `schedule:` block AND the actual dispatch logic in
# "Self-dispatch next tick" below, leave both commented, don't delete) --
# cancelling in-progress runs alone does not stop a self-rechaining
# workflow.

on:
  # schedule: (commented -- see "PAUSED 2026-09-22" above)
  #   - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write # needed only to self-dispatch this same workflow (this repo's own GITHUB_TOKEN, never the private-repo secret)

concurrency:
  group: pumpfun-runner
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the private repo (source of truth for all code and data)
        uses: actions/checkout@v4
        with:
          repository: S1aughterHau5/Claude
          token: ${{ secrets.PUMPFUN_PRIVATE_REPO_TOKEN }}
          path: private-repo
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Added 2026-09-16 -- this step never existed before because
        # PumpFun had zero npm dependencies until that date. The channel
        # owner's real on-chain quoted fills feature (@solana/web3.js,
        # @pump-fun/pump-sdk) and the live SOL-transfer utility (bs58)
        # both added real dependencies, and this workflow's next several
        # dozen runs failed immediately with ERR_MODULE_NOT_FOUND for
        # '@solana/web3.js' because node_modules was never installed --
        # a real outage, not a hypothetical: it silently broke the whole
        # paper-trading pipeline for over an hour before being caught.
        # npm ci (not npm install) -- deterministic from
        # PumpFun/package-lock.json, which the private repo now commits
        # for exactly this reason.
        working-directory: private-repo/PumpFun
        run: npm ci

      - name: Run unit tests (output suppressed unless they fail)
        working-directory: private-repo/PumpFun
        run: |
          set +e
          npm test > test-output.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "::error::Tests failed -- tail of output:"
            tail -n 80 test-output.log
          fi
          exit $code

      - name: Run mechanical cycle (output suppressed unless it fails)
        working-directory: private-repo/PumpFun
        run: |
          set +e
          npm run run-mechanical-cycle > cycle-output.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "::error::Mechanical cycle failed -- tail of output:"
            tail -n 80 cycle-output.log
          fi
          exit $code
        env:
          STARTING_BALANCE_USD: '500'
          BUY_USD: '5'
          BUY_SOL: '0.03' # channel owner, 2026-09-17: "0.03 sol per trade" -- overrides BUY_USD above, see run-mechanical-cycle.js's own header on this var
          MAX_CONCURRENT_POSITIONS: '10' # channel owner, 2026-09-20: "Open slots to 10" -- was '5', silently overriding run-mechanical-cycle.js's own default
          # Dedicated Alchemy RPCs, added 2026-09-17 -- channel owner:
          # "History and BuySell are clear to go if you want to rotate to
          # ease the heavier lifting rpc calls... Review every RPC call
          # and update to one of these to lighten the load and reduce
          # our errors." Paper trading previously had NO dedicated key at
          # all (fell back to the free public Solana RPC endpoint,
          # lib/solanaRpc.js's own default) -- real data from
          # data/rpc-metrics.json showed 30% of all calls failing with
          # HTTP 429 as a direct result, 84% of them from this cycle's
          # own scan_candidate_distribution walk specifically (the
          # heaviest RPC consumer in the project). Split across two keys
          # now: ALCHEMY_API_WORKER for everything else (matches the
          # rename live trading's own SOLANA_RPC_URL now uses, so scan
          # traffic stays consistent across paper/live), and the
          # DISTRIBUTION-walk-specific SOLANA_RPC_URL_DISTRIBUTION on its
          # OWN key (ALCHEMY_API_HISTORY) -- deliberately a DIFFERENT key
          # from live trading's own distribution split
          # (ALCHEMY_API_SWAPPER, see pumpfun-live-cycle.yml in the
          # private repo), so paper and live never contend with each
          # other on this heaviest-volume call either, even when both
          # run at once. WORKER/HISTORY/SWAPPER are the channel owner's
          # own personal Alchemy keys, confirmed dormant/unused before
          # this. Never ALCHEMY_API_PRICESOCKET -- that one is the SAME
          # underlying key as monitor mode's own ALCHEMY_API_RESEARCH
          # (channel owner's own words: "do not use PriceSocket as its
          # the same as research").
          SOLANA_RPC_URL: https://solana-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_WORKER }}
          SOLANA_RPC_URL_DISTRIBUTION: https://solana-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_HISTORY }}

      - name: Commit and push results back to the private repo
        if: always()
        # if: always() so a failed cycle still commits/pushes whatever
        # log output exists, and -- more importantly -- so the
        # self-dispatch step below still runs and the chain doesn't die
        # on one bad tick (same reasoning as the private repo's own copy
        # of this pattern).
        working-directory: private-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PumpFun/data/ PumpFun/Logs/
          git diff --cached --quiet && echo "No new results to commit." && exit 0
          git commit -m "pumpfun: mechanical cycle (via Monitor runner) - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed successfully (attempt $i)."
              exit 0
            fi
            echo "Push rejected (attempt $i) -- another run pushed first. Rebasing onto the fresh remote head and retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              # A conflicting rebase leaves the working tree full of literal
              # conflict markers. Under `bash -e` a bare failed `git rebase`
              # here would kill this whole step immediately (no retry, no
              # abort), and worse -- the NEXT commit/push step's `git add`
              # would happily stage that conflicted content as if it were
              # valid, corrupting data/ and Logs/ in the private repo. Same
              # bug class already fixed in monitor/processingWorker.js and
              # discoveryWorker.js's own commitLoop(); abort and let this
              # cycle's results drop rather than push corrupted state.
              echo "::warning::Rebase conflict on attempt $i -- aborting rebase, this cycle's results will not be pushed."
              git rebase --abort
              break
            fi
            sleep $((i * 2))
          done
          echo "::error::Failed to push results after 5 attempts."
          exit 1

      - name: Self-dispatch next tick
        if: always()
        run: |
          # PAUSED -- channel owner, 2026-09-22: "Stop the pump fun
          # trading bot. Stop everything." Only the forever-chain that
          # starts NEW cycles is cut here; nothing else in this workflow
          # was touched. To resume, revert this commit (which also
          # restores the schedule: trigger above) and manually
          # workflow_dispatch this workflow.
          echo "Self-dispatch disabled -- paper trading was explicitly stopped by the channel owner. Not starting another cycle."
          exit 0
          sleep 15
          HTTP_CODE=$(curl -sS -o /tmp/dispatch_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pumpfun-runner.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$HTTP_CODE" = "204" ]; then
            echo "Self-dispatched next tick successfully (HTTP 204)."
          else
            echo "::warning::Self-dispatch for next tick returned HTTP $HTTP_CODE (expected 204): $(cat /tmp/dispatch_resp.json)"
          fi
